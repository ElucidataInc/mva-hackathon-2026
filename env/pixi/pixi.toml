# Reviewed first-stage setup. No patient data or reference downloads are tasks.
# Run installations from the project root. Retain pixi.toml and pixi.lock together.
# Resolved package versions are recorded in pixi.lock after the first solve.
[workspace]
name = "mva-wgs"
version = "0.2.0"
description = "QC, phenotype preparation, VEP 116 and Exomiser runtime"
channels = ["conda-forge", "bioconda"]
channel-priority = "strict"
platforms = ["linux-64"]
requires-pixi = ">=0.81.0,<0.82"

[feature.qc.dependencies]
python = "3.12.*"
bcftools = "*"
samtools = "*"
htslib = "*"
fastqc = "*"
multiqc = "*"

[feature.phenotype.dependencies]
python = "3.12.*"
pandas = "*"
requests = "*"
networkx = "*"
obonet = "*"
curl = "*"

[feature.phenotype.pypi-dependencies]
pyhpo = "*"

[feature.annotate.dependencies]
ensembl-vep = "116.2.*"
bcftools = "*"
htslib = "*"

[feature.annotate.tasks]
vep-local = { cmd = "vep --offline --cache --cache_version 116 --assembly GRCh38 --species homo_sapiens --dir_cache references/vep/116 --fasta references/vep/116/Homo_sapiens.GRCh38.dna.primary_assembly.fa", cwd = "../.." }

[feature.rank.dependencies]
openjdk = "21.*"
bcftools = "*"

[feature.align.dependencies]
bwa = "0.7.19.*"
samtools = "1.24.*"
mosdepth = "0.3.14.*"
whatshap = "2.8.*"

[feature.sv.dependencies]
delly = "2.6.0.*"
samtools = "1.24.*"

# Runtime for the official Manta 1.6.0 binary under tools/ (Manta requires Python 2)
[feature.manta.dependencies]
python = "2.7.*"

[feature.gatk]
platforms = ["linux-64"]
channels = ["conda-forge", "bioconda", "https://conda.anaconda.org/conda-forge", "https://conda.anaconda.org/bioconda"]

[feature.gatk.target.linux-64.dependencies]
python = { version = "3.10.13.*", channel = "conda-forge" }
pip = "23.3.1.*"
blas = { version = "==1.0", build = "mkl" }
numpy = { version = "1.26.2.*", channel = "conda-forge" }
pymc = { version = "5.10.1.*", channel = "conda-forge" }
fastprogress = "1.0.3.*"
pytensor = { version = "2.18.3.*", channel = "conda-forge" }
scipy = { version = "1.11.4.*", channel = "conda-forge" }
h5py = { version = "3.10.0.*", channel = "conda-forge" }
pytorch = { version = "==2.1.0", build = "*mkl*100", channel = "conda-forge" }
pytorch-lightning = { version = "2.4.0.*", channel = "conda-forge" }
scikit-learn = { version = "1.3.2.*", channel = "conda-forge" }
matplotlib = { version = "3.8.2.*", channel = "conda-forge" }
pandas = { version = "2.1.3.*", channel = "conda-forge" }
tqdm = { version = "4.66.1.*", channel = "conda-forge" }
dill = { version = "0.3.7.*", channel = "conda-forge" }
biopython = { version = "1.84.*", channel = "conda-forge" }
r-base = "4.3.1.*"
"r-data.table" = "1.14.8.*"
r-dplyr = "1.1.3.*"
r-getopt = "1.20.4.*"
r-ggplot2 = "3.4.4.*"
r-gplots = "3.1.3.*"
r-gsalib = "2.2.1.*"
r-optparse = "1.7.3.*"
r-backports = "1.4.1.*"
pysam = { version = "0.22.0.*", channel = "bioconda" }
pyvcf = { version = "0.6.8.*", channel = "conda-forge" }

[feature.gatk.target.linux-64.pypi-dependencies]
gatkpythonpackages = { path = "/home/ubuntu/mva-hackathon-2026/tools/gatk-4.7.0.0/gatkPythonPackageArchive.zip" }

[feature.popgen.dependencies]
vcftools = "0.1.17.*"
plink = "1.90b7.7.*"
plink2 = "2.0.0a.6.9.*"

[environments]
qc = { features = ["qc"], no-default-feature = true }
phenotype = { features = ["phenotype"], no-default-feature = true }
annotate = { features = ["annotate"], no-default-feature = true }
rank = { features = ["rank"], no-default-feature = true }
align = { features = ["align"], no-default-feature = true }
sv = { features = ["sv"], no-default-feature = true }
manta = { features = ["manta"], no-default-feature = true }
gatk = { features = ["gatk"], no-default-feature = true }
popgen = { features = ["popgen"], no-default-feature = true }
