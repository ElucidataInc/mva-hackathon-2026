[workspace]
channels = ["conda-forge", "bioconda"]
name = "combine_pixi"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.11.*"
bcftools = ">=1.24,<2"
htslib = ">=1.24,<2"
truvari = ">=5.5.0,<6"
annotsv = ">=3.5.10,<4"
bedtools = ">=2.31.1,<3"
pysam = ">=0.24.1,<0.25"
numpy = "<2"
pandas = "<3"
gcc_linux-64 = ">=16.2.0,<17"
gxx_linux-64 = ">=16.2.0,<17"
cython = ">=3.3.0,<4"

[pypi-dependencies]
svafotate = { git = "https://github.com/fakedrtom/SVAFotate.git" }
